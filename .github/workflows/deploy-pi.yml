name: Build and Deploy to Raspberry Pi

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install dependencies
        run: npm install

      - name: Build static site
        env:
          VITE_NHL_API_HOST: ${{ secrets.VITE_NHL_API_HOST }}
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}
        run: npm run build

      - name: Upload static build artifact
        uses: actions/upload-artifact@v4
        with:
          name: site-dist
          path: ./dist
          retention-days: 1

  deploy:
    needs: build
    runs-on: self-hosted
    steps:
      - name: Checkout configuration files
        uses: actions/checkout@v4
        with:
          sparse-checkout: |
            Caddyfile
            Containerfile
          sparse-checkout-cone-mode: false

      - name: Download static build artifact
        uses: actions/download-artifact@v4
        with:
          name: site-dist
          path: ./dist

      - name: Build rootless Podman image
        run: podman build -t personal-website -f Containerfile .

      - name: Recreate container inside the Pod
        run: |
          podman rm -f website-container 2>/dev/null || true
          podman run -d --pod website-pod --name website-container personal-website
